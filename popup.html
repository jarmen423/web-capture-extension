<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Capture Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      padding: 16px;
    }

    .container {
      background: white;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    h1 {
      font-size: 18px;
      margin-bottom: 14px;
      color: #667eea;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1::before { content: "📸"; font-size: 22px; }

    .section { margin-bottom: 14px; }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      font-size: 12px;
      color: #555;
    }

    input[type="text"],
    input[type="number"],
    textarea,
    select {
      width: 100%;
      padding: 9px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 13px;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    textarea { min-height: 60px; resize: vertical; }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #667eea;
    }

    .mode-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px 4px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      text-align: center;
      font-size: 12px;
    }

    .mode-btn:hover { border-color: #667eea; transform: translateY(-1px); }
    .mode-btn.active { background: #667eea; color: white; border-color: #667eea; }

    .input-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .checkbox-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #667eea;
    }

    .checkbox-row label {
      margin: 0;
      font-weight: 500;
      font-size: 12px;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 8px;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-secondary {
      width: 100%;
      padding: 9px;
      background: #f0f0f0;
      color: #333;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 4px;
    }

    .btn-secondary:hover:not(:disabled) { background: #e0e0e0; }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .action-buttons button {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      min-width: 70px;
    }

    .btn-stop { background: #f44336; color: white; }
    .btn-pause { background: #ff9800; color: white; }
    .btn-resume { background: #4CAF50; color: white; }
    .btn-export { background: #2196F3; color: white; }
    .btn-export-secondary { background: #673AB7; color: white; }

    .action-buttons button:hover { opacity: 0.85; }

    .status {
      padding: 10px;
      background: #f8f9fa;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 10px;
      border-left: 4px solid #667eea;
      word-break: break-word;
    }

    .status.active { background: #e7f3ff; border-left-color: #2196F3; }
    .status.success { background: #e8f5e9; border-left-color: #4CAF50; }
    .status.error { background: #ffebee; border-left-color: #f44336; }
    .status.warning { background: #fff8e1; border-left-color: #ff9800; }

    .progress {
      width: 100%;
      height: 6px;
      background: #e0e0e0;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 8px;
      display: none;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      width: 0%;
      transition: width 0.3s;
    }

    .hidden { display: none !important; }

    .info-text {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
      font-style: italic;
    }

    .divider {
      height: 1px;
      background: #e0e0e0;
      margin: 12px 0;
    }

    .advanced-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding: 6px 0;
      font-size: 12px;
      font-weight: 600;
      color: #667eea;
    }

    .advanced-toggle:hover { text-decoration: underline; }

    .advanced-section {
      display: none;
      padding-top: 8px;
    }

    .advanced-section.open { display: block; }

    .error-list {
      max-height: 60px;
      overflow-y: auto;
      font-size: 11px;
      color: #c62828;
      margin-top: 6px;
    }

    .error-item {
      padding: 2px 0;
      border-bottom: 1px solid #eee;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Web Capture Pro</h1>

    <div class="section">
      <label>Capture Mode</label>
      <div class="mode-selector">
        <button class="mode-btn active" data-mode="screenshot" id="screenshotMode">📷 Screenshots</button>
        <button class="mode-btn" data-mode="text" id="textMode">📝 Text</button>
        <button class="mode-btn" data-mode="batch" id="batchMode">📋 Batch</button>
      </div>
    </div>

    <div class="section" id="urlSection">
      <label for="startUrl">Start URL</label>
      <input type="text" id="startUrl" placeholder="https://example.com/docs" value="">
      <div class="info-text">Enter the first page URL to start capturing</div>
    </div>

    <div class="section hidden" id="batchSection">
      <label for="batchUrls">Batch URLs (one per line)</label>
      <textarea id="batchUrls" placeholder="https://example.com/page1&#10;https://example.com/page2"></textarea>
      <div class="info-text">Each URL will be captured in order</div>
    </div>

    <div class="section">
      <div class="input-group">
        <div>
          <label for="maxPages">Max Pages</label>
          <input type="number" id="maxPages" value="10" min="1" max="100">
        </div>
        <div>
          <label for="delay">Delay (ms)</label>
          <input type="number" id="delay" value="2000" min="500" step="500">
        </div>
      </div>
      <div class="info-text">Delay allows pages to fully load before capture</div>
    </div>

    <div class="section hidden" id="screenshotOptions">
      <div class="checkbox-row">
        <input type="checkbox" id="fullPage">
        <label for="fullPage">Full-page screenshots (scroll &amp; stitch)</label>
      </div>
    </div>

    <div class="section">
      <div class="advanced-toggle" id="advancedToggle">
        <span>⚙️ Advanced Options</span>
        <span id="advancedArrow">▼</span>
      </div>
      <div class="advanced-section" id="advancedSection">
        <label for="customContentSelector">Content CSS Selector</label>
        <input type="text" id="customContentSelector" placeholder="article, .docs-content, main">
        <div class="info-text">Target specific content area for text extraction</div>

        <label for="customNextSelector" style="margin-top:8px">Next Link CSS Selector</label>
        <input type="text" id="customNextSelector" placeholder="a[rel='next'], .pagination-next">
        <div class="info-text">Override auto-detected next-page navigation</div>
      </div>
    </div>

    <div class="section">
      <button class="btn-primary" id="startBtn">Start Capture</button>

      <div class="action-buttons hidden" id="actionButtons">
        <button class="btn-stop" id="stopBtn">Stop</button>
        <button class="btn-pause" id="pauseBtn">Pause</button>
        <button class="btn-export hidden" id="exportBtn">Export HTML</button>
        <button class="btn-export-secondary hidden" id="exportPdfBtn">Export PDF</button>
      </div>
    </div>

    <div class="section">
      <div class="status" id="status">Ready to capture</div>
      <div class="progress" id="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="error-list hidden" id="errorList"></div>
    </div>

    <div class="divider"></div>

    <div class="section">
      <button class="btn-secondary" id="helpBtn">ℹ️ Help &amp; Instructions</button>
      <button class="btn-secondary" id="optionsBtn">⚙️ Settings</button>
    </div>
  </div>

  <script src="utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
